<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c4f69">一个 Transformer 层的非嵌入参数账（d = d_model）</text>

  <!-- 总长 12d^2 -->
  <rect x="100" y="70" width="200" height="70" rx="4" fill="#ccddfb" stroke="#1e66f5"/>
  <rect x="300" y="70" width="400" height="70" rx="4" fill="#e5d5fb" stroke="#8839ef"/>
  <text x="200" y="102" text-anchor="middle" font-size="14" fill="#1e66f5">注意力 QKVO</text>
  <text x="200" y="124" text-anchor="middle" font-size="14" fill="#4c4f69">4·d²</text>
  <text x="500" y="102" text-anchor="middle" font-size="14" fill="#8839ef">前馈网络 FFN（两个矩阵）</text>
  <text x="500" y="124" text-anchor="middle" font-size="15" fill="#4c4f69">8·d²</text>

  <text x="200" y="168" text-anchor="middle" font-size="13" fill="#6c6f85">占 1/3</text>
  <text x="500" y="168" text-anchor="middle" font-size="13" fill="#6c6f85">占 2/3 —— Transformer 的参数量大头在这里</text>

  <text x="450" y="212" text-anchor="middle" font-size="13" fill="#6c6f85">Geva et al. 2020 的结论：FFN 占了模型 2/3 的参数，干的却是「查记忆」的活 —— 大模型的知识主要存在 FFN 里</text>
</svg>
