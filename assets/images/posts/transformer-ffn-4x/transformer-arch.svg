<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c7f93"/>
    </marker>
  </defs>
  <!-- ===== 编码器 ===== -->
  <text x="220" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c4f69">编码器 Encoder</text>
  <rect x="120" y="556" width="200" height="36" rx="6" fill="#e6e9ef" stroke="#bcc0cc"/>
  <text x="220" y="579" text-anchor="middle" font-size="14" fill="#4c4f69">输入词嵌入 Inputs</text>
  <line x1="220" y1="556" x2="220" y2="530" stroke="#7c7f93" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="545" font-size="12" fill="#8c8fa1">+ 位置编码</text>

  <rect x="60" y="270" width="320" height="250" rx="10" fill="#fafbff" stroke="#1e66f5" stroke-dasharray="6 4"/>
  <text x="220" y="292" text-anchor="middle" font-size="13" fill="#1e66f5">N × 堆叠（原论文 N=6）</text>

  <rect x="90" y="306" width="260" height="42" rx="6" fill="#ccddfb" stroke="#1e66f5"/>
  <text x="220" y="332" text-anchor="middle" font-size="14" fill="#1e66f5">多头自注意力 Multi-Head Attention</text>
  <rect x="90" y="356" width="260" height="20" rx="4" fill="#eff1f5" stroke="#bcc0cc"/>
  <text x="220" y="370" text-anchor="middle" font-size="12" fill="#6c6f85">残差连接 + 层归一化</text>
  <rect x="90" y="386" width="260" height="42" rx="6" fill="#e5d5fb" stroke="#8839ef"/>
  <text x="220" y="412" text-anchor="middle" font-size="14" fill="#8839ef">前馈网络 FFN</text>
  <rect x="90" y="436" width="260" height="20" rx="4" fill="#eff1f5" stroke="#bcc0cc"/>
  <text x="220" y="450" text-anchor="middle" font-size="12" fill="#6c6f85">残差连接 + 层归一化</text>

  <line x1="220" y1="270" x2="220" y2="240" stroke="#7c7f93" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="220" cy="232" r="5" fill="#1e66f5"/>

  <!-- ===== 编码器 → 解码器 连线 ===== -->
  <path d="M 226 228 C 400 210 480 340 566 340" fill="none" stroke="#fe640b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="380" y="262" font-size="12" fill="#fe640b">K, V</text>

  <!-- ===== 解码器 ===== -->
  <text x="700" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#4c4f69">解码器 Decoder</text>
  <rect x="600" y="556" width="200" height="36" rx="6" fill="#e6e9ef" stroke="#bcc0cc"/>
  <text x="700" y="579" text-anchor="middle" font-size="14" fill="#4c4f69">输出词嵌入 Outputs（右移一位）</text>
  <line x1="700" y1="556" x2="700" y2="530" stroke="#7c7f93" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="545" font-size="12" fill="#8c8fa1">+ 位置编码</text>

  <rect x="540" y="210" width="320" height="310" rx="10" fill="#fafbff" stroke="#8839ef" stroke-dasharray="6 4"/>
  <text x="700" y="232" text-anchor="middle" font-size="13" fill="#8839ef">N × 堆叠（原论文 N=6）</text>

  <rect x="570" y="246" width="260" height="42" rx="6" fill="#ccddfb" stroke="#1e66f5"/>
  <text x="700" y="272" text-anchor="middle" font-size="14" fill="#1e66f5">带掩码的多头注意力 Masked MHA</text>
  <rect x="570" y="296" width="260" height="20" rx="4" fill="#eff1f5" stroke="#bcc0cc"/>
  <text x="700" y="310" text-anchor="middle" font-size="12" fill="#6c6f85">残差连接 + 层归一化</text>
  <rect x="570" y="326" width="260" height="42" rx="6" fill="#ffdcc3" stroke="#fe640b"/>
  <text x="700" y="352" text-anchor="middle" font-size="14" fill="#b44d09">编码器-解码器交叉注意力</text>
  <rect x="570" y="376" width="260" height="20" rx="4" fill="#eff1f5" stroke="#bcc0cc"/>
  <text x="700" y="390" text-anchor="middle" font-size="12" fill="#6c6f85">残差连接 + 层归一化</text>
  <rect x="570" y="406" width="260" height="42" rx="6" fill="#e5d5fb" stroke="#8839ef"/>
  <text x="700" y="432" text-anchor="middle" font-size="14" fill="#8839ef">前馈网络 FFN</text>
  <rect x="570" y="456" width="260" height="20" rx="4" fill="#eff1f5" stroke="#bcc0cc"/>
  <text x="700" y="470" text-anchor="middle" font-size="12" fill="#6c6f85">残差连接 + 层归一化</text>

  <line x1="700" y1="210" x2="700" y2="184" stroke="#7c7f93" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="140" width="240" height="40" rx="6" fill="#e6e9ef" stroke="#bcc0cc"/>
  <text x="700" y="165" text-anchor="middle" font-size="14" fill="#4c4f69">Linear + Softmax</text>
  <line x1="700" y1="140" x2="700" y2="114" stroke="#7c7f93" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="580" y="70" width="240" height="40" rx="6" fill="#d5ead6" stroke="#40a02b"/>
  <text x="700" y="95" text-anchor="middle" font-size="14" fill="#2f7a1f">输出概率 Output Probabilities</text>

  <text x="460" y="624" text-anchor="middle" font-size="12" fill="#8c8fa1">蓝色 = 负责 token 之间「通信」的注意力；紫色 = 负责每个 token 独立思考的 FFN；橙色 = 编码器向解码器传递信息</text>
</svg>
