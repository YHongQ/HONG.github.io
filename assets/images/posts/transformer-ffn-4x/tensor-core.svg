<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <pattern id="grid16" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#bcc0cc" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c4f69">GPU Tensor Core 的「整数账」：中间层维度必须是 128 的倍数</text>

  <!-- 左侧：对齐的维度 -->
  <rect x="60" y="70" width="360" height="110" rx="8" fill="#fafbff" stroke="#40a02b"/>
  <text x="240" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f7a1f">对齐（无浪费）</text>
  <text x="240" y="124" text-anchor="middle" font-size="14" fill="#4c4f69">d_model = 4096 = 128 × 32</text>
  <text x="240" y="150" text-anchor="middle" font-size="14" fill="#4c4f69">d_ff = 11008 = 128 × 86</text>
  <text x="240" y="172" text-anchor="middle" font-size="12" fill="#6c6f85">11008 正是 8/3 × 4096 ≈ 10923 向上取整到 128 的倍数</text>

  <!-- 右侧：不对齐 -->
  <rect x="480" y="70" width="360" height="110" rx="8" fill="#fdf2f4" stroke="#d20f39"/>
  <text x="660" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#d20f39">不对齐（要 padding）</text>
  <text x="660" y="124" text-anchor="middle" font-size="14" fill="#4c4f69">d_ff = 10923（不是 128 的倍数）</text>
  <text x="660" y="150" text-anchor="middle" font-size="14" fill="#4c4f69">实际计算 11008，多算 185 列</text>
  <text x="660" y="172" text-anchor="middle" font-size="12" fill="#6c6f85">无效元素照样过 Tensor Core，算力白白浪费</text>

  <!-- tile 示意 -->
  <rect x="60" y="200" width="256" height="64" fill="url(#grid16)" stroke="#1e66f5" stroke-width="1.5"/>
  <rect x="60" y="200" width="32" height="32" fill="#1e66f5" opacity="0.35" stroke="#1e66f5"/>
  <text x="76" y="221" text-anchor="middle" font-size="11" fill="#1e66f5">16×16</text>
  <text x="188" y="240" text-anchor="middle" font-size="12" fill="#4c4f69">FP16 Tensor Core 原生 tile = 16×16×16</text>
  <text x="560" y="240" text-anchor="middle" font-size="12" fill="#6c6f85">维度越是对齐 tile，GEMM 越容易喂饱 Tensor Core；模型维度是「对着硬件整数」算出来的</text>
</svg>
